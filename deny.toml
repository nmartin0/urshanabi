# The dependency policy for the systems-language workspace (RULES.md E1):
# known licences only, no known advisories, crates only from the one
# public registry.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only, each compatible with proprietary use. Zlib
# arrives through the code generator, at build time only.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
