# The one workspace for every systems-language component (RULES.md E2):
# one dependency set, one lockfile, shared lints.
[workspace]
resolver = "3"
members = ["libs/ontology", "services/query"]

[workspace.package]
edition = "2024"
# The oldest toolchain the workspace is verified on; CI builds with the
# toolchain pinned in rust-toolchain.toml.
rust-version = "1.91"
publish = false

[workspace.dependencies]
prost = "0.14.4"  # rung 3: the contract language's chosen implementation (R-06)
serde = { version = "1.0.229", features = ["derive"] }  # rung 2: the canonical serialisation framework
toml = "1.1.6"  # rung 2: the canonical parser of the ontology's format (R-51)
prost-types = "0.14.4"  # rung 3: with prost (R-06)
tonic = "0.14.6"  # rung 3: the chosen RPC implementation (R-06)
tonic-prost = "0.14.6"  # rung 3: with tonic (R-06)
tonic-prost-build = "0.14.6"  # rung 3: with tonic (R-06)
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }  # rung 2: the canonical asynchronous runtime
tracing = "0.1.44"  # rung 2: the canonical logging façade
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }  # rung 2: with tracing

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
