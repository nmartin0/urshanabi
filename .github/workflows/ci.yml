# CI runs exactly what anyone can run locally: script/cibuild.
# Every check lives in the repository's own scripts (RULES.md E5).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cibuild:
    name: script/cibuild
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pinned tools, the interpreter built from source and the locked
      # tool set, kept between runs: any change to a lock file makes a new
      # key, so a cache can never hold a version the locks no longer name.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('script/tools.lock', 'script/interpreter.lock', 'pylock.toml') }}
      - name: script/cibuild
        run: script/cibuild
        env:
          CONTRACTS_BREAKING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
